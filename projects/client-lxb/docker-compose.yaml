services:
  emdash-cms:
    build:
      context: .
      dockerfile: projects/client-lxb/Dockerfile
      args:
        - EMDASH_ENCRYPTION_KEY=${EMDASH_ENCRYPTION_KEY}
        - NODE_VERSION=${NODE_VERSION:-26}
    restart: unless-stopped
    environment:
      - "NODE_ENV=${NODE_ENV:-production}"
      - "EM_DATA_PATH=${EM_DATA_PATH:-/app/db}"
      - "EM_UPLOADS_PATH=${EM_UPLOADS_PATH:-/app/uploads}"
      - "EMDASH_ENCRYPTION_KEY=${EMDASH_ENCRYPTION_KEY}"
    volumes:
      - "emdash_db:/app/db"
      - "emdash_uploads:/app/uploads"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  emdash_db:
  emdash_uploads:
