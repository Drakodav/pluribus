services:
  emdash-cms:
    build:
      context: .
      dockerfile: projects/client-lxb/Dockerfile
    restart: unless-stopped
    environment:
      - EMDASH_ENCRYPTION_KEY
      - EMDASH_SITE_URL
    volumes:
      - "emdash_db:/app/db"
      - "emdash_uploads:/app/uploads"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  emdash_db:
  emdash_uploads:
