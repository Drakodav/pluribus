services:
  emdash-cms:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - EM_DATA_PATH=${EM_DATA_PATH:-/app/data}
    ports:
      - "${PORT:-4321}:4321"
    volumes:
      - emdash_db:${EM_DATA_PATH:-/app/data}
      - emdash_uploads:${EM_DATA_PATH:-/app/data}/uploads

volumes:
  emdash_db:
  emdash_uploads:
