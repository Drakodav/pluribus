<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lxb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd8b4" />
      <stop offset="50%" stop-color="#c99b58" />
      <stop offset="100%" stop-color="#916428" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" flood-color="#c99b58" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#231c18" />
  
  <!-- Left Bear Ear -->
  <circle cx="28" cy="28" r="12" fill="url(#lxb-grad)" />
  <circle cx="28" cy="28" r="6" fill="#231c18" />

  <!-- Right Bear Ear -->
  <circle cx="72" cy="28" r="12" fill="url(#lxb-grad)" />
  <circle cx="72" cy="28" r="6" fill="#231c18" />

  <!-- Main Balloon / Bear Face -->
  <ellipse cx="50" cy="50" rx="30" ry="32" fill="url(#lxb-grad)" filter="url(#glow)" />

  <!-- Snout / Balloon Highlight -->
  <ellipse cx="50" cy="55" rx="14" ry="11" fill="#ffffff" fill-opacity="0.95" />
  <ellipse cx="50" cy="51" rx="6" ry="4" fill="#231c18" />

  <!-- Bear Eyes -->
  <circle cx="39" cy="44" r="3.5" fill="#231c18" />
  <circle cx="61" cy="44" r="3.5" fill="#231c18" />

  <!-- Balloon Knot & Ribbon at Bottom -->
  <polygon points="46,82 54,82 50,86" fill="#916428" />
  <path d="M50,86 Q54,92 48,96" stroke="#c99b58" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
