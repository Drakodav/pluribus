<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd8b4" />
      <stop offset="50%" stop-color="#c99b58" />
      <stop offset="100%" stop-color="#916428" />
    </linearGradient>
  </defs>

  <!-- Brand Mark (Bear Balloon) -->
  <g transform="translate(6, 5)">
    <!-- Ears -->
    <circle cx="16" cy="16" r="9" fill="url(#logo-grad)" />
    <circle cx="16" cy="16" r="4.5" fill="#ffffff" />
    <circle cx="44" cy="16" r="9" fill="url(#logo-grad)" />
    <circle cx="44" cy="16" r="4.5" fill="#ffffff" />

    <!-- Balloon Head -->
    <ellipse cx="30" cy="30" rx="22" ry="24" fill="url(#logo-grad)" />

    <!-- Snout & Nose -->
    <ellipse cx="30" cy="34" rx="10" ry="8" fill="#ffffff" fill-opacity="0.95" />
    <ellipse cx="30" cy="31" rx="4.5" ry="3" fill="#231c18" />

    <!-- Eyes -->
    <circle cx="22" cy="26" r="2.5" fill="#231c18" />
    <circle cx="38" cy="26" r="2.5" fill="#231c18" />

    <!-- Balloon Knot -->
    <polygon points="27,54 33,54 30,57" fill="#916428" />
    <path d="M30,57 Q33,61 29,64" stroke="#916428" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="76" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#231c18" letter-spacing="-0.02em">
    LUXE BEAR
  </text>
  <text x="216" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a8783d" letter-spacing="0.05em">
    — BALLOON BAR
  </text>
  <text x="76" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#8c786a" letter-spacing="0.16em">
    STUDIO CELEBRATIONS
  </text>
</svg>
