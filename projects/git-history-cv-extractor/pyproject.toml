[project]
name = "git-history-cv-extractor"
version = "0.1.0"
description = "Extracts git history and changes for CV/resume context generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Standard library tools will be used initially; external packages can be added as needed.
    "gitpython>=3.1.50",
    "questionary>=2.1.1",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.3.0",
    "ty>=0.0.57",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]

