[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab"
version = "0.1.0"
description = "Type-safe declarative configuration and orchestration engine for hybrid cloud homelab"
readme = "CONTEXT.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.57",
]

[project.scripts]
homelab = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cli", "models", "providers", "workflows"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
