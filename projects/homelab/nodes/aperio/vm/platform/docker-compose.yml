services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    network_mode: host
    depends_on:
      error-pages:
        condition: service_healthy
    environment:
      CF_DNS_API_TOKEN: "${GLOBAL_CLOUDFLARE_API_TOKEN}"
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.exposedbydefault=false"
      - "--providers.consulcatalog.endpoint.address=localhost:8500"
      - "--providers.consulcatalog.endpoint.scheme=http"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.delaybeforecheck=20"
      - "--certificatesresolvers.myresolver.acme.email=${GLOBAL_ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--serverstransport.insecureskipverify=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${GLOBAL_ROOT_DOMAIN}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik.middlewares=auth-traefik@docker,error-pages-middleware@docker"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # Authentik Traefik Middleware
      - "traefik.http.middlewares.auth-traefik.forwardauth.address=http://${NODE_MACERATOR_BACKBONE_IP}:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.auth-traefik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth-traefik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,Authorization,Cookie,Set-Cookie"
      # Coolify Wildcard Apps Ingress (*.apps.${GLOBAL_ROOT_DOMAIN})
      - "traefik.http.routers.coolify-wildcard.rule=HostRegexp(`[a-z0-9-]+\\.apps\\.${GLOBAL_ROOT_DOMAIN}`)"
      - "traefik.http.routers.coolify-wildcard.entrypoints=websecure"
      - "traefik.http.routers.coolify-wildcard.tls.certresolver=myresolver"
      - "traefik.http.routers.coolify-wildcard.tls.domains[0].main=*.apps.${GLOBAL_ROOT_DOMAIN}"
      - "traefik.http.routers.coolify-wildcard.service=coolify-apps-upstream"
      - "traefik.http.routers.coolify-wildcard.middlewares=error-pages-middleware@docker"
      - "traefik.http.services.coolify-apps-upstream.loadbalancer.server.url=https://${NODE_MACERATOR_BACKBONE_IP}:443"
      # Catch all unused domains with 404 error pages
      - "traefik.http.routers.catchall-404.rule=HostRegexp(`[a-z0-9-]+\\.${GLOBAL_ROOT_DOMAIN}`)"
      - "traefik.http.routers.catchall-404.entrypoints=websecure"
      - "traefik.http.routers.catchall-404.tls.certresolver=myresolver"
      - "traefik.http.routers.catchall-404.service=error-pages-service"
      - "traefik.http.routers.catchall-404.priority=9"

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo_periphery_aperio
    restart: always
    network_mode: host
    environment:
      PERIPHERY_PORT: 8120
      PERIPHERY_CORE_ADDRESS: http://${NODE_MACERATOR_BACKBONE_IP}:9120
      PERIPHERY_CONNECT_AS: aperio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  consul-server:
    image: hashicorp/consul:latest
    container_name: consul-server
    restart: always
    volumes:
      - consul-data:/consul/data
    network_mode: host
    environment:
      CONSUL_LOCAL_CONFIG: '{"ui_config":{"enabled":true}}'
      SERVICE_IGNORE: "true"
    command: "agent -server -bootstrap-expect=1 -client=0.0.0.0 -bind=${NODE_APERIO_BACKBONE_IP}"
    healthcheck:
      test: ['CMD', 'consul', 'info']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consul.rule=Host(`consul.${GLOBAL_ROOT_DOMAIN}`)"
      - "traefik.http.routers.consul.entrypoints=websecure"
      - "traefik.http.routers.consul.tls.certresolver=myresolver"
      - "traefik.http.routers.consul.middlewares=auth-traefik@docker"
      - "traefik.http.routers.consul.service=consul-server-ui"
      - "traefik.http.services.consul-server-ui.loadbalancer.server.url=http://127.0.0.1:8500"

  error-pages:
    image: ghcr.io/tarampampam/error-pages:4
    environment:
      TEMPLATE_NAME: lost-in-space
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.error-pages-router.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.error-pages-router.priority=10"
      - "traefik.http.routers.error-pages-router.entrypoints=web"
      - "traefik.http.routers.error-pages-router.middlewares=error-pages-middleware"
      - "traefik.http.middlewares.error-pages-middleware.errors.status=400-599"
      - "traefik.http.middlewares.error-pages-middleware.errors.service=error-pages-service"
      - "traefik.http.middlewares.error-pages-middleware.errors.query=/{status}"
      - "traefik.http.services.error-pages-service.loadbalancer.server.port=8080"

volumes:
  consul-data:
