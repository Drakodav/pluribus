packages:
  - "projects/*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@astrojs/internal-helpers@0.12.0"
  - "@astrojs/markdown-satteri@0.4.3"
  - astro@7.3.6
  - emdash
  - "@emdash-cms/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
blockExoticSubdeps: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
